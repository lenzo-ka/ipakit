name: CI

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    # Nightly full suite: runs the slow-marked sweep tests that per-PR CI skips.
    - cron: "0 7 * * *"
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # Decide whether this push/PR touches anything but documentation. A doc-only
  # change cannot move the metric, the derived artifacts or the Python surface,
  # so the three build jobs below skip it and only `docs` runs. Every gate that
  # reads the documents must therefore live in `docs` and not only in the
  # pytest job, or a doc-only change skips its own check. The default is
  # to run everything: anything we cannot cleanly diff sets code=true, so the
  # optimization can only ever skip work it is sure is safe to skip.
  changes:
    name: detect doc-only changes
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: filter
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.sha }}
        run: |
          set -eu
          # Fail safe: no usable base (first push, force-push, missing SHA) runs
          # the full build rather than guessing what changed.
          if [ -z "${BASE:-}" ] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "no usable base ('${BASE:-}'); running full CI"
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          changed="$(git diff --name-only "$BASE" "$HEAD")"
          echo "changed files:"
          printf '  %s\n' $changed
          code=false
          while IFS= read -r f; do
            [ -z "$f" ] && continue
            case "$f" in
              # The doc set: docs/, any markdown, the generated tutorial
              # notebook, and the license. Everything else is code.
              docs/*|*.md|ipakit/notebooks/*|LICENSE*) ;;
              *) code=true ;;
            esac
          done <<INNER
          $changed
          INNER
          echo "run build jobs? code=$code"
          echo "code=$code" >> "$GITHUB_OUTPUT"

  lint:
    name: lint (ruff / black / mypy)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[lint]"
      - run: ruff check ipakit tests scripts
      - run: black --check ipakit tests scripts
      - run: mypy --config-file=pyproject.toml

  test:
    name: test (py${{ matrix.python-version }})
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12", "3.13"]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # The test extra carries lxml, which is what validates the shipped XML
      # against the grammars beside it; without a validator test_schema.py
      # errors rather than skipping, so this job is where that is guaranteed
      # to run. The ICU-backed X-SAMPA cross-check self-skips (importorskip);
      # the confusion-matrix guard is stdlib and runs.
      - run: pip install -e ".[test]"
      # What is under test, asserted before anything tests it. The suite is
      # only evidence about this branch if `import ipakit` resolves inside the
      # checkout, and nothing here checked that: an install resolving to a
      # published ipakit instead would run the whole suite green against code
      # the branch does not contain. `make check` has run this since it
      # existed; CI, which is the run anyone actually reads, did not.
      # It also puts the tiergraph path and version in the log, which is the
      # provenance a red run gets diagnosed against.
      - name: The subject under test is this checkout
        run: python -m scripts.gate_subject
      # Across the runner's cores, as the Makefile does. A matrix job is three
      # runs of the same suite, so the saving is paid three times per push.
      # The default -m 'not slow' (pyproject addopts) keeps the O(n^2) sweep
      # tests out of the per-PR run; the full-suite job below runs them.
      - run: pytest -n auto

  full-suite:
    name: full suite (incl. slow)
    needs: changes
    # The per-PR test job skips slow-marked sweep tests to keep feedback fast.
    # This job runs every test, slow included, where the wait is acceptable:
    # merges to main, the nightly schedule, and manual dispatch — never on a
    # pull_request.
    if: ${{ github.event_name != 'pull_request' && needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      - run: pip install -e ".[test]"
      # Override the addopts default (-m 'not slow') so every test runs.
      - run: pytest -m "slow or not slow" -n auto

  guards:
    name: derived-artifact guards (ICU)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # dev pulls icukit-pyicu (bundled ICU + PyICU) so the X-SAMPA table can be derived.
      - run: pip install -e ".[dev]"
      - name: X-SAMPA table matches ICU + overrides
        run: python scripts/xsampa_table.py validate
      - name: Confusion matrix matches the metric
        run: python scripts/confusion.py validate
      - name: Committed tiergraph baselines match their manifest
        run: PYTHONHASHSEED=0 python scripts/tiergraph_capture.py verify-baselines
      # The full invariant sweep, including "derived artifacts current", which
      # is what caught the stale figure record this commit repairs. `make
      # check` has always run it and CI never did, so the only thing standing
      # between a regenerated artifact and a stale record of it was whether
      # somebody happened to run the release gate by hand. About 40 seconds.
      - name: Invariants hold and derived artifacts are current
        run: PYTHONHASHSEED=0 python scripts/invariants.py
      # The last two release-gate steps CI did not reach. Both re-derive a
      # committed golden and compare; the manifest above only proves those
      # goldens have not been hand-edited, which is a different question from
      # whether the code still produces them. Nothing else reads either file:
      # containment-navigation.json is read only by containment_oracle.py, and
      # consolidation_parity.sha256 only by consolidation_parity.py -- the
      # parity test asserts a round-trip over the corpus, never that the
      # committed digest still matches it. About four seconds together.
      - name: Containment navigation matches its golden
        run: PYTHONHASHSEED=0 python scripts/containment_oracle.py
      - name: Consolidation parity digest matches the derived corpus
        run: PYTHONHASHSEED=0 python scripts/consolidation_parity.py check
      - name: ICU cross-check tests (skipped in the matrix job)
        run: pytest tests/test_xsampa.py
      - name: Panphon characterization tests (skipped in the matrix job)
        run: pytest tests/test_panphon_facts.py tests/test_panphon_live_geometry.py tests/tiergraph/test_j_panphon.py

  render:
    name: render (figure tests need real renderers)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # The figure tests measure a rendered raster or layout, so they need a
      # real renderer -- rsvg-convert (librsvg2-bin) for the SVG figures, dot
      # (graphviz) for the tiergraph layout. No other job installs one, so
      # everywhere else those figure tests skip. This job installs both and is
      # the one place they run.
      - run: sudo apt-get update && sudo apt-get install -y graphviz librsvg2-bin
      - run: pip install -e ".[test]"
      # REQUIRE_RENDERERS turns a missing renderer from a silent skip into a
      # hard failure here (see tests/_renderers.py), so this job cannot go green
      # having rendered nothing. `-m 'slow or not slow'` overrides the addopts
      # default (`-m 'not slow'`) so the slow-marked figure tests run too.
      - name: Figure tests run against installed renderers
        env:
          REQUIRE_RENDERERS: "1"
        run: pytest tests/test_tract_figures.py tests/test_animation_rest.py tests/test_frontal.py tests/tiergraph/test_dot.py -m "slow or not slow" -q

  docs:
    name: docs (README + tutorial values current)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: python -m pip install --upgrade pip
      # The doc examples run against the installed package and its dependencies;
      # scripts/docexamples.py, scripts/docquotes.py and scripts/tutorial.py
      # are stdlib-only.
      - run: pip install -e .
      - name: README and docs Python examples produce their stated values
        run: PYTHONHASHSEED=0 python scripts/docexamples.py
      # Runs here, not only in the pytest job, because a doc-only change skips
      # that job and a doc-only change is exactly what breaks a quotation.
      - name: Quotations are in the documents they cite
        run: python scripts/docquotes.py .
      - name: Tutorial page and notebook are current
        run: PYTHONHASHSEED=0 python scripts/tutorial.py check all
      # Three more generated documents with a `check` mode each. `make check`
      # has run all three for as long as they have existed; CI never has, so
      # the regenerate-never-hand-edit rule held only for whoever ran the
      # release gate by hand, and a drifting exhibit reached main green.
      # They belong in this job rather than a code-triggered one because two
      # of the three derive from code while the artifact lives under docs/:
      # an exhibit goes stale when the metric moves, and it also goes stale
      # when someone edits the document, and this is the only job that runs
      # for both. Together they add about a second.
      - name: House-style exhibits match ipa.xml
        run: python scripts/house_style.py check
      - name: Perceptual-validation exhibits match the data and the metric
        run: PYTHONHASHSEED=0 python scripts/perceptual_validation.py check
      - name: State of the work matches docs/design
        run: python scripts/state_of_work.py check
