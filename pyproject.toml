[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license = "BSD-2-Clause"` string form below.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipakit"
dynamic = ["version"]
description = "IPA toolkit: phonetic features, distance, tokenization, rules, and conversions"
readme = "README.md"
authors = [
    {name = "Kevin Lenzo"}
]
license = "BSD-2-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
keywords = ["ipa", "phonetics", "phonology", "linguistics", "speech", "cmu", "arpabet", "timit", "x-sampa", "kirshenbaum", "phonetic-distance", "g2p"]
dependencies = [
    "tiergraph @ git+https://github.com/lenzo-ka/tiergraph@efed8c68e090b02928b51646e988dfd3a36efa40",
]

[project.optional-dependencies]
# Split so each CI job installs only what it needs:
#   test - run the suite. lxml is the RELAX NG validator tests/test_schema.py
#          checks the shipped XML with, and xdist runs the suite across cores
#          (PYTEST_WORKERS=0 makes it serial). Nothing else in the suite needs
#          a third-party package, and the ICU cross-check self-skips.
#   lint - ruff / black / mypy (pinned to the pre-commit style year)
#   icu  - icukit-pyicu (bundled ICU + PyICU wheel, `import icu`); powers
#          scripts/xsampa_table.py and the X-SAMPA cross-check. Dev-only, NEVER
#          imported at runtime (ipakit ships the generated table in data/).
#   interop - pyclts and panphon, the two libraries scripts/interop.py measures
#          ipakit against. Same terms as icu: dev-only, NEVER imported at
#          runtime, and read by one script rather than by the library. Neither
#          generates anything ipakit ships -- the measurements they support are
#          arguments in docs/design/interop.md, so the reason to pin them here
#          is that a number nobody can reproduce is not evidence. pyclts also
#          wants a clone of cldf-clts/clts, which is data under its own license
#          and is not a Python dependency at all; the script says how to get it.
#   dev  - everything, for local development.
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "lxml>=6.1.1"]
lint = ["ruff>=0.16.1", "mypy>=2.3.1", "black>=26.5,<27"]
icu = ["icukit-pyicu>=78.3.0"]
interop = ["pyclts>=4.0.2", "panphon>=0.22.2"]
align = ["pocketsphinx>=5.1.1,<6"]
dev = ["ipakit[test,lint,icu,interop,align]"]

[project.urls]
Homepage = "https://github.com/lenzo-ka/ipakit"
Repository = "https://github.com/lenzo-ka/ipakit"
Documentation = "https://github.com/lenzo-ka/ipakit/tree/main/docs"
Changelog = "https://github.com/lenzo-ka/ipakit/blob/main/CHANGELOG.md"
Issues = "https://github.com/lenzo-ka/ipakit/issues"

[project.scripts]
ipakit = "ipakit.cli:main"

# Single source of truth for the version: ipakit.__version__ (see ipakit/__init__.py).
[tool.setuptools.dynamic]
version = {attr = "ipakit.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ipakit*"]

[tool.setuptools.package-data]
ipakit = [
    "data/*.xml",
    "data/*.rng",
    "data/phonemaps/*.xml",
    "data/phonemaps/*.rng",
    "data/supplements/*.xml",
    "data/supplements/*.rng",
    "data/syllables/*.xml",
    "data/syllables/*.rng",
    "data/bridges/*/*.xml",
    "data/bridges/*.rng",
    "data/rules/*.rules",
    "data/*.json",
    "data/attested/*.json",
    # Attested data are read by validation rather than by the runtime. The
    # notebook is also read by nothing -- it is handed to a student, copied
    # out of the install by `ipakit notebook` -- so it travels separately.
    "notebooks/*.ipynb",
    "py.typed",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (require network, deselect with '-m \"not slow\"')",
]
# Scope collection to the package and tests (keeps --doctest-modules from
# importing scripts/). Run docstring examples as part of the suite so they
# can't silently rot; ELLIPSIS lets examples elide volatile output (floats).
testpaths = ["ipakit", "tests"]
doctest_optionflags = ["ELLIPSIS"]
# Don't run slow tests by default.
# The worker cap lives here as well as in the Makefile so it also binds a bare
# `pytest` run: xdist's 'auto' takes every core, and several agents run this
# suite in parallel worktrees, so an uncapped ad-hoc run oversubscribes the
# box for everyone. `make check` passes its own -n, and -n on the command line
# overrides this, so a deliberate `pytest -n auto` is still one word away.
addopts = "-m 'not slow' --doctest-modules -n 3"

# ipakit/notebooks/ is out of both style gates. Its one file is a rendering of
# docs/tutorial.src.md, compared byte for byte against a fresh render by
# `make check` -- a formatter that rewrote it would fail that check, and a
# linter reading tutorial cells reports on the tutorial's prose style rather
# than on any code anybody wrote here. Every one of those cells is executed by
# `scripts/tutorial.py check`, which is a stronger claim than either gate makes.

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "ipakit/notebooks/"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["ipakit", "tests"]
extend-exclude = ["ipakit/notebooks/"]

[tool.ruff.lint]
# black owns formatting; ruff lints only. E501 (line length) is left to black.
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
files = ["ipakit"]

[[tool.mypy.overrides]]
# The interop extra is optional: panphon is untyped when installed and absent
# in CI, and a per-module override is clean in both environments where an
# inline ignore cannot be.
module = "panphon.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Optional C extension without a py.typed marker; align.py keeps the import
# function-local and tests its runtime boundary with and without the extra.
module = "pocketsphinx.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Local development may expose tiergraph from an adjacent working tree. Fresh
# and isolated installs resolve the pinned Git dependency declared above. The
# submodule glob keeps isolated lint envs (mirrors-mypy) from failing on
# tiergraph subpackages such as tiergraph.machine.
module = ["tiergraph", "tiergraph.*"]
ignore_missing_imports = true
