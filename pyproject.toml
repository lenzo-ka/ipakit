[build-system]
# setuptools>=77 is required for the PEP 639 SPDX `license = "BSD-2-Clause"` string form below.
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ipakit"
dynamic = ["version"]
description = "IPA toolkit: phonetic features, distance, tokenization, rules, and conversions"
readme = "README.md"
authors = [
    {name = "Kevin Lenzo"}
]
license = "BSD-2-Clause"
requires-python = ">=3.12"
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Human Machine Interfaces",
    "Topic :: Text Processing :: Linguistic",
    "Typing :: Typed",
]
keywords = ["ipa", "phonetics", "phonology", "linguistics", "speech", "cmu", "arpabet", "timit", "x-sampa", "kirshenbaum", "phonetic-distance", "g2p"]
dependencies = [
    # Capped at the minor because tiergraph is pre-1.0 and each 0.X.0 breaks
    # deliberately -- an alpha minor is effectively a major, so `<0.3.0` is the
    # honest bound rather than a cautious one.
    #
    # The comment that stood here was measured, checked, and cleared the wrong
    # three things: it named the `star` member on the Semiring protocol, the
    # 24-to-18 selection cut and `to_jsonl`'s version key, said ipakit used none
    # of them -- all true -- and listed `tiergraph`, `tiergraph.build`,
    # `tiergraph.machine` and `tiergraph.path` as the exposed surface. None of
    # that is what broke. A comment that reads as reassurance is worse than one
    # nobody checked, so what actually broke is recorded instead:
    #
    #   five renames        ClockPosition->ClockCoordinate, PositionRef->
    #                       BoundaryRef, PositionBinding->BoundaryBinding,
    #                       ResolvedPosition->ResolvedBoundary, and
    #                       POSITION_NOT_IN_PARENT->BOUNDARY_NOT_IN_PARENT
    #   one dropped value   AttributeDomain.POSITION, replaced by BOUNDARY --
    #                       a wire change, not a rename
    #   one more rename     DurablePositionRef->DurableBoundaryRef
    #   four MEMBERS        ClockProfile.from_position_values, and on Graph:
    #                       position_values, resolve_position, promote_position
    #   the wire version    "format_version": "6" became "0.2.0"
    #
    # Thirteen, where the handover list named nine. The four member renames are
    # the reason to distrust a name-level diff: `hasattr(tiergraph,
    # 'ClockProfile')` is true whether or not its methods moved, so checking
    # exported names says nothing about members. Migrating found them; diffing
    # could not.
    #
    # Tiergraph 0.2.0 is published on PyPI (2026-09-05). Keep a version
    # requirement rather than a direct Git URL so IPAkit remains publishable.
    # Before that publication, development supplied the checkout out of band.
    # Historical migration check at tiergraph main 6276260: tests/tiergraph
    # reported 151 passed and 2 old-wire golden failures, not code defects.
    "tiergraph>=0.2.0,<0.3.0",
]

[project.optional-dependencies]
# Split so each CI job installs only what it needs:
#   test - run the suite. lxml is the RELAX NG validator tests/test_schema.py
#          checks the shipped XML with, and xdist runs the suite across cores
#          (PYTEST_WORKERS=0 makes it serial). Nothing else in the suite needs
#          a third-party package, and the ICU cross-check self-skips.
#   lint - ruff / black / mypy (pinned to the pre-commit style year)
#   icu  - icukit-pyicu (bundled ICU + PyICU wheel, `import icu`); powers
#          scripts/xsampa_table.py and the X-SAMPA cross-check. Dev-only, NEVER
#          imported at runtime (ipakit ships the generated table in data/).
#   interop - pyclts and panphon, the two libraries scripts/interop.py measures
#          ipakit against. Same terms as icu: dev-only, NEVER imported
#          during frozen runtime use. Explicit library extraction uses pyclts
#          as the pinned oracle for the shipped finite BIPA snapshot; its data
#          retain their separate attribution/license. Live measurements are
#          also reproducible against the selected resolver. pyclts also
#          wants a clone of cldf-clts/clts, which is data under its own license
#          and is not a Python dependency at all; the script says how to get it.
#   compare - scipy, numpy and matplotlib; powers scripts/compare_inventories.py.
#          Dev-only, NEVER imported at runtime: the library supplies the metric,
#          while this one reader-run example clusters and draws its result.
#   dev  - everything, for local development.
test = ["pytest>=9.1.1", "pytest-xdist>=3.8.0", "lxml>=6.1.2", "packaging>=24.2"]
lint = ["ruff>=0.16.5", "mypy>=2.3.1", "black>=26.5.1,<27"]
icu = ["icukit-pyicu>=78.3.0"]
interop = ["pyclts==4.0.2", "panphon>=0.22.2"]
compare = ["scipy>=1.18.0", "numpy>=2.5.0", "matplotlib>=3.11.0"]
align = ["pocketsphinx>=5.1.1,<6"]
dev = ["ipakit[test,lint,icu,interop,compare,align]"]

[project.urls]
Homepage = "https://github.com/lenzo-ka/ipakit"
Repository = "https://github.com/lenzo-ka/ipakit"
Documentation = "https://github.com/lenzo-ka/ipakit/tree/main/docs"
Changelog = "https://github.com/lenzo-ka/ipakit/blob/main/CHANGELOG.md"
Issues = "https://github.com/lenzo-ka/ipakit/issues"

[project.scripts]
ipakit = "ipakit.cli:main"

# Single source of truth for the version: ipakit.__version__ (see ipakit/__init__.py).
[tool.setuptools.dynamic]
version = {attr = "ipakit.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ipakit*"]

[tool.setuptools.package-data]
ipakit = [
    "data/*.xml",
    "data/*.rng",
    "data/feature-models/*.xml",
    "data/feature-models/*.txt",
    "data/feature-models/*.md",
    "data/phonemaps/*.xml",
    "data/phonemaps/*.rng",
    "data/supplements/*.xml",
    "data/supplements/*.rng",
    "data/syllables/*.xml",
    "data/syllables/*.rng",
    "data/bridges/*/*.xml",
    "data/bridges/*.rng",
    "data/rules/*.rules",
    "data/*.json",
    "data/clts/*.json",
    "data/clts/*.txt",
    "data/attested/*.json",
    "data/textgrid/*.json",
    # Attested data are read by validation rather than by the runtime. The
    # notebook is also read by nothing -- it is handed to a student, copied
    # out of the install by `ipakit notebook` -- so it travels separately.
    "notebooks/*.ipynb",
    "py.typed",
]

[tool.pytest.ini_options]
markers = [
    "slow: marks tests as slow (require network, deselect with '-m \"not slow\"')",
]
# Scope collection to the package and tests (keeps --doctest-modules from
# importing scripts/). Run docstring examples as part of the suite so they
# can't silently rot; ELLIPSIS lets examples elide volatile output (floats).
testpaths = ["ipakit", "tests"]
doctest_optionflags = ["ELLIPSIS"]
# Don't run slow tests by default.
# The worker cap lives here as well as in the Makefile so it also binds a bare
# `pytest` run: xdist's 'auto' takes every core, and several agents run this
# suite in parallel worktrees, so an uncapped ad-hoc run oversubscribes the
# box for everyone. `make check` passes its own -n, and -n on the command line
# overrides this, so a deliberate `pytest -n auto` is still one word away.
addopts = "-m 'not slow' --doctest-modules -n 3"

# ipakit/notebooks/ is out of both style gates. Its one file is a rendering of
# docs/tutorial.src.md, compared byte for byte against a fresh render by
# `make check` -- a formatter that rewrote it would fail that check, and a
# linter reading tutorial cells reports on the tutorial's prose style rather
# than on any code anybody wrote here. Every one of those cells is executed by
# `scripts/tutorial.py check`, which is a stronger claim than either gate makes.

[tool.black]
line-length = 88
target-version = ["py312"]
extend-exclude = "ipakit/notebooks/"

[tool.ruff]
line-length = 88
target-version = "py312"
src = ["ipakit", "tests"]
extend-exclude = ["ipakit/notebooks/"]

[tool.ruff.lint]
# black owns formatting; ruff lints only. E501 (line length) is left to black.
#
# The second group is a ratchet rather than a cleanup: each of those four is at
# zero across `ipakit tests scripts` today, so selecting them changes no line
# of code and only fixes the current state in place. They are chosen for what
# they would catch here, not for being free -- families that cannot fire in
# this repo at all are left out, because a rule that can never fail is a gate
# in name only: logging, numpy and Django have no code here to check, and FA
# is inert at `target-version = py312`, where neither of its rules can fire.
#
#   ERA  commented-out code, which goes stale silently and is read as live
#   PGH  blanket `# noqa` and `# type: ignore` -- a bare suppression hides
#        which rule it answers, and that ambiguity is what made an earlier
#        RUF100 sweep unsafe to act on
#   PLE  pylint's error class, including the bidirectional-unicode check,
#        which is worth having in a package whose data is Unicode phonetics
#   T10  a `breakpoint()` or `pdb` import left behind
select = ["E", "F", "I", "UP", "B", "ERA", "PGH", "PLE", "T10"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_unused_configs = true
# Scoped to the package. Widening to cover dev-only comparison code is the
# standing intent, but the CI lint job installs `.[lint]` only, which carries
# ruff, black and mypy and no pytest -- so any scope reaching a test file fails
# there on missing stubs while passing locally under `.[dev]`. Widen when there
# is dev-only code outside the package to cover, and add pytest to `lint` in the
# same change.
files = ["ipakit"]

[[tool.mypy.overrides]]
# The interop extra is optional: panphon is untyped when installed and absent
# in CI, and a per-module override is clean in both environments where an
# inline ignore cannot be.
module = ["panphon.*", "pyclts.*"]
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Optional C extension without a py.typed marker; align.py keeps the import
# function-local and tests its runtime boundary with and without the extra.
module = "pocketsphinx.*"
ignore_missing_imports = true
follow_imports = "skip"

[[tool.mypy.overrides]]
# Local development may expose tiergraph from an adjacent working tree. Fresh
# and isolated installs resolve the pinned Git dependency declared above. The
# submodule glob keeps isolated lint envs (mirrors-mypy) from failing on
# tiergraph subpackages such as tiergraph.machine, and the sibling
# tiergraph_dot renderer.
module = ["tiergraph", "tiergraph.*", "tiergraph_dot"]
ignore_missing_imports = true
