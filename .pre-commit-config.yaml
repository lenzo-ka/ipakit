# Pre-commit hooks for ipakit.
# Mirrors the HSG repo's hook set, adapted for ipakit's flat layout (package at
# ./ipakit, tests at ./tests). Tool settings live in pyproject.toml.
# Install once with:  pip install -e ".[dev]" && pre-commit install
minimum_pre_commit_version: "3.0.0"

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: trailing-whitespace
        files: ^(ipakit|tests)/
        # Praat's long TextGrid format writes a trailing space after every value.
        exclude: ^tests/fixtures/textgrid/
      - id: end-of-file-fixer
        files: ^(ipakit|tests)/
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
        # tests/panphon/panphon.xml is a 1.5 MB declaration of another
        # project's feature table, generated by scripts/panphon_geometry.py
        # and checked against the installed library. It is deliberately
        # committed and deliberately not distributed. The guard stays at its
        # default for everything else.
        exclude: ^tests/panphon/panphon\.xml$
      - id: check-merge-conflict

  - repo: https://github.com/psf/black-pre-commit-mirror
    rev: 26.5.1
    hooks:
      - id: black
        # Match the lint job's scope exactly. CI runs `black --check ipakit
        # tests scripts`; leaving scripts out here made every local commit
        # touching one report "Passed" for a file the hook never opened, and
        # the divergence only surfaced in CI.
        files: ^(ipakit|tests|scripts)/

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.18
    hooks:
      - id: ruff-check
        args: ["--fix"]
        # As above: CI runs `ruff check ipakit tests scripts`.
        files: ^(ipakit|tests|scripts)/

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v2.1.0
    hooks:
      - id: mypy
        # NOT widened to match the others. `pyproject.toml` sets
        # `files = ["ipakit"]` deliberately, because the lint job installs
        # `.[lint]`, which has no pytest -- a scope reaching a test file
        # fails there while passing locally under `.[dev]`. This hook agrees
        # with that scope; widening it would disagree with CI rather than
        # match it.
        files: ^ipakit/
        args: ["--config-file=pyproject.toml"]
